# Cloudflare Worker for Heirloom Health: AI answer-finding, speech-to-text, and encrypted family sync.
# Setup steps are in README.md in this folder.
name = "heirloom-health"
main = "worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
# Give the Worker its free https://heirloom-health.<account>.workers.dev address.
workers_dev = true

[vars]
# Websites allowed to call this server (comma-separated).
ALLOWED_ORIGINS = "https://doddasiddharth-debug.github.io,http://localhost:8000"
# Free models on Cloudflare Workers AI (used unless you add the paid keys below).
EXTRACT_MODEL = "@cf/google/gemma-4-26b-a4b-it"
TRANSCRIBE_MODEL_FREE = "@cf/openai/whisper-large-v3-turbo"
# OpenAI speech-to-text model (only used if OPENAI_API_KEY is set).
TRANSCRIBE_MODEL = "whisper-1"
# Turn feedback into GitHub issues in this repository (also needs the GITHUB_TOKEN secret).
GITHUB_REPO = "doddasiddharth-debug/heirloom-health"

# Cloudflare Workers AI: free open models for speech-to-text and reading transcripts.
[ai]
binding = "AI"

# Encrypted family copies, feedback and rate-limit counters. Create it with:  npx wrangler kv namespace create FAMILY
# then paste the id it prints here.
[[kv_namespaces]]
binding = "FAMILY"
id = "fd3827f62636442597fb623d37828662"

# Optional secrets (never put these in this file):
#   npx wrangler secret put ANTHROPIC_API_KEY   use Claude instead of the free model for reading transcripts
#   npx wrangler secret put OPENAI_API_KEY      use OpenAI instead of the free model for speech-to-text
#   npx wrangler secret put GITHUB_TOKEN        a fine-grained token with "Issues: write" on GITHUB_REPO
